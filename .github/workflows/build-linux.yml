name: Build Linux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64

    # clang everywhere: conan profile detect and meson both honor CC/CXX.
    # Required for -stdlib=libc++
    env:
      CC: clang
      CXX: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld libc++-dev libc++abi-dev python3-pip ninja-build
          pip install meson conan

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Install dependencies via Conan
        run: |
          mkdir -p build/conan
          conan install . -s compiler.libcxx=libc++ --output-folder=build/conan --deployer=direct_deploy --deployer-folder=build/conan --build=missing

      - name: Configure
        run: meson setup build/release --buildtype=release -Db_lto=true -Dcpp_args=-stdlib=libc++ '-Dcpp_link_args=-stdlib=libc++'
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/build/conan

      - name: Build
        run: meson compile -C build/release

      - name: Run tests
        run: SKIP_NETWORK_TESTS=1 ./run_tests.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nari-linux-${{ matrix.arch }}
          path: |
            build/release/nari
            build/release/naric
            build/release/nari-lsp
