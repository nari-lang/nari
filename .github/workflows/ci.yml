name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version for a dry-run package name (e.g. v0.0.0-dev)'
        required: false
        default: 'v0.0.0-dev'

permissions:
  contents: write   # required for softprops/action-gh-release

jobs:
  build:
    name: ${{ matrix.os_label }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # linux: clang + libc++, linked statically (static_libcxx)
          - runner: ubuntu-24.04
            os_label: linux
            arch: x86_64
            conan_extra: -s compiler.libcxx=libc++
            meson_extra: -Dcpp_args=-stdlib=libc++ -Dstatic_libcxx=true
          - runner: ubuntu-24.04-arm
            os_label: linux
            arch: arm64
            conan_extra: -s compiler.libcxx=libc++
            meson_extra: -Dcpp_args=-stdlib=libc++ -Dstatic_libcxx=true
          - runner: macos-26-intel
            os_label: macos
            arch: x86_64
          - runner: macos-26
            os_label: macos
            arch: arm64
          - runner: windows-2022 # VS2022, windows-latest doesn't work yet
            os_label: windows
            arch: x86_64
            msvc_arch: x64
            exe_suffix: .exe
            conan_extra: -s compiler.cppstd=17
            experimental: true
          # Experimental: uses the patched mbedtls recipe (conan/recipes/mbedtls)
          # to build under MSVC/ARM64. continue-on-error keeps it from blocking.
          - runner: windows-11-arm
            os_label: windows
            arch: arm64
            msvc_arch: arm64
            exe_suffix: .exe
            conan_extra: -s compiler.cppstd=17
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Toolchain
      - name: Install Build tools (Linux)
        if: matrix.os_label == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld libc++-dev libc++abi-dev python3-pip ninja-build patchelf
          pip install --break-system-packages meson conan
          # clang so conan profile detect + meson build with libc++ (static_libcxx).
          echo "CC=clang"   >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      - name: Install Build tools (macOS)
        if: matrix.os_label == 'macos'
        run: |
          # coreutils provides gtimeout, used by run_tests.sh (no GNU timeout on macOS).
          brew install ninja coreutils
          python3 -m pip install --break-system-packages meson conan

      - name: Set up MSVC environment (Windows)
        if: matrix.os_label == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Install Build tools (Windows)
        if: matrix.os_label == 'windows'
        run: pip install meson ninja conan

      - name: Detect Conan profile
        run: conan profile detect --force

      # Windows/ARM64 only: force the patched mbedtls (still 3.5.0, so libcurl's
      # pin holds) so aesce.c is skipped under MSVC. See conan/recipes/mbedtls.
      - name: Export patched mbedtls (Windows ARM64)
        if: matrix.os_label == 'windows' && matrix.arch == 'arm64'
        run: conan export conan/recipes/mbedtls --version 3.5.0

      - name: Install dependencies via Conan
        run: |
          mkdir -p build/conan
          conan install . ${{ matrix.conan_extra }} --output-folder=build/conan --deployer=direct_deploy --deployer-folder=build/conan --build=missing

      - name: Configure (release + LTO)
        run: meson setup build/release --buildtype=release -Db_lto=true ${{ matrix.meson_extra }}
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/build/conan

      - name: Compile
        run: meson compile -C build/release

      # Ubuntu leaves a dangling NEEDED entry for libunwind.so.1 even though --unwindlib=libgcc routes the real symbols to libgcc_s.
      - name: Strip dangling libunwind dep (Linux)
        if: matrix.os_label == 'linux'
        run: |
          for b in build/release/nari build/release/naric build/release/nari-lsp; do
            [ -f "$b" ] && patchelf --remove-needed libunwind.so.1 "$b" || true
          done

      - name: Smoke test (Unix)
        if: matrix.os_label != 'windows'
        shell: bash
        run: |
          ./build/release/nari --help >/dev/null
          printf 'print("hello from %s-%s");\n' "${{ matrix.os_label }}" "${{ matrix.arch }}" > smoke.nari
          ./build/release/nari smoke.nari

      - name: Smoke test (Windows)
        if: matrix.os_label == 'windows'
        shell: bash
        run: |
          ./build/release/nari.exe --help >/dev/null
          printf 'print("hello from %s-%s");\n' "${{ matrix.os_label }}" "${{ matrix.arch }}" > smoke.nari
          ./build/release/nari.exe smoke.nari
    
      - name: Run tests
        if: matrix.os_label != 'windows'
        run: SKIP_BUILD=1 SKIP_NETWORK_TESTS=1 ./run_tests.sh
        
      # package
      #
      # Extracted layout (both formats):
      #   nari-<version>-<os>-<arch>/
      #     bin/{nari,naric,nari-lsp}[.exe]   the Nari runtime + compiler frontend
      #     LICENSE
      #     README.md
      - name: Package (Unix)
        if: matrix.os_label != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          NAME="nari-${VERSION}-${{ matrix.os_label }}-${{ matrix.arch }}"
          STAGE="dist/${NAME}"
          mkdir -p "${STAGE}/bin"
          cp build/release/nari  "${STAGE}/bin/nari"
          cp build/release/nari-lsp  "${STAGE}/bin/nari-lsp"
          cp build/release/naric "${STAGE}/bin/naric"
          if command -v strip >/dev/null 2>&1; then
            strip "${STAGE}/bin/nari" || true
            strip "${STAGE}/bin/naric" || true
            strip "${STAGE}/bin/nari-lsp" || true
          fi
          cp LICENSE   "${STAGE}/LICENSE"   || true
          cp README.md "${STAGE}/README.md" || true
          # sha256sum (coreutils) on Linux; shasum fallback on macOS.
          sha256() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          ( cd dist && tar --format=ustar -czf "${NAME}.tar.gz" "${NAME}" )
          ( cd dist && sha256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256" )
          rm -rf "${STAGE}"
          ls -la dist/

      - name: Package (Windows)
        if: matrix.os_label == 'windows'
        shell: pwsh
        run: |
          $VERSION = "${{ steps.version.outputs.version }}"
          $NAME = "nari-$VERSION-windows-${{ matrix.arch }}"
          $STAGE = "dist/$NAME"
          New-Item -ItemType Directory -Force -Path "$STAGE/bin" | Out-Null
          Copy-Item build/release/nari.exe  "$STAGE/bin/nari.exe"
          Copy-Item build/release/nari-lsp.exe "$STAGE/bin/nari-lsp.exe"
          Copy-Item build/release/naric.exe "$STAGE/bin/naric.exe"
          Copy-Item LICENSE   "$STAGE/LICENSE"   -ErrorAction SilentlyContinue
          Copy-Item README.md "$STAGE/README.md" -ErrorAction SilentlyContinue
          Compress-Archive -Path "$STAGE" -DestinationPath "dist/$NAME.zip" -Force
          $hash = (Get-FileHash "dist/$NAME.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $NAME.zip" | Out-File -Encoding ascii -NoNewline "dist/$NAME.zip.sha256"
          Remove-Item -Recurse -Force "$STAGE"
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nari-${{ matrix.os_label }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Combined SHASUMS256.txt
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          sha256() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          : > SHASUMS256.txt
          for f in *.tar.gz *.zip; do
            sha256 "$f" >> SHASUMS256.txt
          done
          cat SHASUMS256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
            dist/SHASUMS256.txt
