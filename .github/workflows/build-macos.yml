name: Build macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build macos-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26-intel
            arch: x64
          - runner: macos-26
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install ninja
          python3 -m pip install --break-system-packages meson conan

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Install dependencies via Conan
        run: |
          mkdir -p build/conan
          conan install . --output-folder=build/conan --deployer=direct_deploy --deployer-folder=build/conan --build=missing

      - name: Configure
        run: meson setup build/release --buildtype=release -Db_lto=true
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/build/conan

      - name: Build
        run: meson compile -C build/release

      - name: Run tests
        run: SKIP_NETWORK_TESTS=1 ./run_tests.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nari-macos-${{ matrix.arch }}
          path: |
            build/release/nari
            build/release/naric
            build/release/nari-lsp
